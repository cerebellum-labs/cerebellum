name: Set up Go
description: >-
  Installs the Go version from packages/server/go.mod and restores the job's
  own module and build cache. Save the cache at the end of the job with
  actions/cache/save, the cache-key and cache-paths outputs, on main only.

# Each job keeps its own cache: lint, the -race tests and govulncheck build
# different things, and with one shared entry only the job that saved it first
# ever got its build cached. The key ends with the commit, so main saves a
# fresh entry on every merge, and restore-keys hands a branch the newest one,
# for the same go.sum if possible. Branches never save: their entries would
# only crowd main's out of the repository's 10 GB cache.

inputs:
  cache-name:
    description: Name of the job's cache, unique per job.
    required: true

outputs:
  cache-key:
    description: Key to save the cache under.
    value: ${{ steps.key.outputs.key }}
  cache-paths:
    description: Directories to save, the module and build caches.
    value: ${{ steps.key.outputs.paths }}

runs:
  using: composite
  steps:
    - id: go
      uses: actions/setup-go@v7
      with:
        go-version-file: packages/server/go.mod
        # Replaced by the per-job cache below.
        cache: false

    - id: key
      shell: bash
      env:
        NAME: ${{ inputs.cache-name }}
        GO_VERSION: ${{ steps.go.outputs.go-version }}
        GOMODCACHE: ${{ steps.go.outputs.GOMODCACHE }}
        GOCACHE: ${{ steps.go.outputs.GOCACHE }}
      run: |
        # Hashed here rather than with hashFiles(), so a missing go.sum fails
        # the step instead of silently leaving the hash out of the key.
        sum=$(sha256sum packages/server/go.sum | cut -d ' ' -f 1)
        job="go-$RUNNER_OS-$RUNNER_ARCH-$GO_VERSION-$NAME-"
        {
          echo "job=$job"
          echo "sum=$job$sum-"
          echo "key=$job$sum-$GITHUB_SHA"
          echo "paths<<EOF"
          echo "$GOMODCACHE"
          echo "$GOCACHE"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@v6
      with:
        path: ${{ steps.key.outputs.paths }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.sum }}
          ${{ steps.key.outputs.job }}
