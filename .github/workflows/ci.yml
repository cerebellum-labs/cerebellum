name: CI

# Runs on every push to every branch and checks the packages the branch
# changes. A pull request is covered by the push run of its branch; one from
# a fork gets no run, since its pushes happen in the fork. The ci-ok job is
# the one check to require on main.
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      push-image:
        description: Push the images built from this branch (br-<branch> and sha-<commit> tags)
        type: boolean
        default: true

permissions: {}

defaults:
  run:
    # An explicit bash adds -o pipefail; GitHub's default doesn't, and a
    # failing script piped into tee would pass.
    shell: bash

concurrency:
  # main queues and never cancels, so :main never moves back to an older
  # commit.
  # A manual run has its own group, so a push to the same branch can't cancel
  # the image build it was started for.
  group: ci-${{ github.ref == 'refs/heads/main' && 'main' || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      server: ${{ steps.changes.outputs.server }}
      server-image: ${{ steps.changes.outputs.server-image }}
      dashboard: ${{ steps.changes.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history for merge-base and the changed file names, but
          # no file contents beyond the checked-out commit.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # On main, the server is compared with the commit the current :main
      # image was built from (see changes.sh). Empty when there is no image
      # or no commit on it, and changes.sh then checks everything.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image=$(.github/scripts/image.sh server)
          revision=$(docker buildx imagetools inspect "$image:main" --format '{{json .Manifest}}' 2>/dev/null |
            jq -r '.annotations["org.opencontainers.image.revision"] // empty') || revision=
          echo "revision=$revision" | tee -a "$GITHUB_OUTPUT"

      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
        run: .github/scripts/changes.sh "$EVENT" "$GITHUB_REF" "$IMAGE_REVISION" | tee -a "$GITHUB_OUTPUT"

  server:
    name: Server
    needs: changes
    # Skipped only on an explicit false: a missing answer runs the checks.
    if: needs.changes.outputs.server != 'false'
    uses: ./.github/workflows/server.yml
    permissions:
      contents: read
      packages: write
    with:
      # Like server, built unless the answer is an explicit false.
      image: ${{ needs.changes.outputs.server-image != 'false' }}
      # Every push to main publishes; a manual run, main included, publishes
      # only when asked to.
      push: ${{ github.event_name == 'workflow_dispatch' && inputs.push-image || github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  dashboard:
    name: Dashboard
    needs: changes
    if: needs.changes.outputs.dashboard != 'false'
    uses: ./.github/workflows/dashboard.yml
    permissions:
      contents: read

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, server, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # A package the branch doesn't touch is skipped and counts as passed; a
      # failed or cancelled job doesn't.
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
          *" failure "* | *" cancelled "*) exit 1 ;;
          esac
