[project]
name = "fruit-sorter"
version = "0.1.0"
description = "Demo robot for Cerebellum: sorts fruit from other things with lights and a servo on a Raspberry Pi."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cerebellum-agent",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
# GPIO on the Raspberry Pi: lights, servo, button.
pi = [
    "gpiozero>=2.0",
    "rpi-lgpio>=0.6",
]

[project.scripts]
fruit-sorter = "fruit_sorter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.sources]
cerebellum-agent = { path = "../../packages/agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fruit_sorter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
